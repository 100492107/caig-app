name: Verify Cornerstone build

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax check server and worker JavaScript
        run: |
          for file in api/*.js shared/*.js scripts/*.mjs; do
            node --check "$file"
          done
          bash -n scripts/start-local-ai-stack.sh
      - run: npm run build
